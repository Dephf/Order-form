<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บันทึกออเดอร์ระบบภายใน</title>
    <!-- เรียกใช้งาน LINE LIFF SDK สำหรับดึงชื่อพนักงานขาย -->
    <script src="https://line-scdn.net"></script>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; padding: 15px; background-color: #f7f9fa; color: #333; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 550px; margin: 0 auto; }
        h2 { text-align: center; color: #06C755; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: bold; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccd2d8; border-radius: 6px; font-size: 15px; background: #fff; }
        input:focus, select:focus, textarea:focus { border-color: #06C755; outline: none; }
        
        .product-item { background: #f8f9fa; padding: 12px; border-radius: 6px; border: 1px dashed #ccc; margin-bottom: 10px; position: relative; }
        .btn-add { background-color: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-bottom: 15px; font-size: 14px; }
        .btn-remove { background-color: #dc3545; color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; position: absolute; right: 10px; top: 10px; font-size: 12px; }
        
        /* จัดกล่องกรอกสินค้าแบ่งเป็น 4 ช่อง */
        .grid-4 { display: grid; grid-template-columns: 2fr 1.5fr 1fr 1fr; gap: 5px; margin-top: 5px; }
        .btn-submit { background-color: #06C755; color: white; padding: 12px; border: none; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .btn-submit:hover { background-color: #05b04b; }
    </style>
</head>
<body>

<div class="card">
    <h2>📝 บันทึกยอดขายระบบภายใน</h2>
    
    <div class="form-group">
        <label for="company">เลือกบริษัท:</label>
        <select id="company">
            <option value="Sun Crop Group">Sun Crop Group</option>
            <option value="SC Crop Care">SC Crop Care</option>
            <option value="NC Agro Chem">NC Agro Chem</option>
        </select>
    </div>

    <div class="form-group">
        <label for="customer">ชื่อลูกค้า / ชื่อร้านค้า:</label>
        <input type="text" id="customer" placeholder="ตัวอย่าง: ร้านทวีการเกษตร">
    </div>

    <label>รายการสินค้า:</label>
    <div id="product-container">
        <div class="product-item" id="item-0">
            <div class="grid-4">
                <input type="text" class="product-name" placeholder="ชื่อสินค้า" required>
                <input type="text" class="product-size" placeholder="ขนาด (e.g. 1x12ลิตร)" required>
                <input type="number" class="product-price" placeholder="ราคาขาย" oninput="calculateTotalSales()" required>
                <input type="number" class="product-qty" placeholder="ปริมาณ" oninput="calculateTotalSales()" required>
            </div>
        </div>
    </div>
    <button type="button" class="btn-add" onclick="addProductRow()">+ เพิ่มสินค้าอีกรายการ</button>

    <div class="form-group">
        <label for="sales">ยอดขายรวมทั้งหมด (บาท):</label>
        <input type="number" id="sales" placeholder="คำนวณอัตโนมัติ" readonly style="background: #e9ecef;">
    </div>

    <div class="form-group">
        <label for="credit">เครดิตลูกค้า (วัน):</label>
        <select id="credit">
            <option value="90">90 วัน</option>
            <option value="60">60 วัน</option>
            <option value="30">30 วัน</option>
            <option value="0">เงินสด / ไม่มีเครดิต</option>
        </select>
    </div>

    <div class="form-group">
        <label for="price_list">ใบราคา (ลิงก์/เลขที่อ้างอิง):</label>
        <input type="text" id="price_list" placeholder="ตัวอย่าง: เลขที่ใบราคา หรือ ลิงก์ใบเสนอราคา">
    </div>

    <div class="form-group">
        <label for="note">หมายเหตุเพิ่มเติม:</label>
        <textarea id="note" rows="2" placeholder="ระบุรายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
    </div>

    <button class="btn-submit" onclick="sendOrderData()">บันทึกออเดอร์ลงระบบ</button>
</div>

<script>
    let rowCount = 1;

    // 1. ฟังก์ชันกดเพิ่มแถวรายการสินค้า
    function addProductRow() {
        const container = document.getElementById('product-container');
        const newRow = document.createElement('div');
        newRow.className = 'product-item';
        newRow.id = `item-${rowCount}`;
        newRow.innerHTML = `
            <button type="button" class="btn-remove" onclick="removeProductRow(${rowCount})">ลบ</button>
            <div class="grid-4" style="margin-top: 15px;">
                <input type="text" class="product-name" placeholder="ชื่อสินค้า" required>
                <input type="text" class="product-size" placeholder="ขนาด (e.g. 1x12ลิตร)" required>
                <input type="number" class="product-price" placeholder="ราคาขาย" oninput="calculateTotalSales()" required>
                <input type="number" class="product-qty" placeholder="ปริมาณ" oninput="calculateTotalSales()" required>
            </div>
        `;
        container.appendChild(newRow);
        rowCount++;
    }

    // 2. ฟังก์ชันกดลบแถวรายการสินค้า
    function removeProductRow(id) {
        document.getElementById(`item-${id}`).remove();
        calculateTotalSales();
    }

    // 3. ฟังก์ชันคำนวณยอดขายรวม (ราคาขาย x ปริมาณ) อัตโนมัติ
    function calculateTotalSales() {
        const prices = document.getElementsByClassName('product-price');
        const qtys = document.getElementsByClassName('product-qty');
        let total = 0;
        for(let i=0; i<prices.length; i++) {
            const p = parseFloat(prices[i].value) || 0;
            const q = parseFloat(qtys[i].value) || 0;
            total += p * q;
        }
        document.getElementById('sales').value = total;
    }

    // 4. เชื่อมต่อระบบ LINE LIFF 
    async function initLiff() {
        try {
            // ⚠️ จุดที่ 1: นำ LIFF ID จากหน้า LINE Login คอนโซลมาใส่แทนที่นี่
            await liff.init({ liffId: "2012388912-BOzxL3Gh" });
            if (!liff.isLoggedIn()) { liff.login(); }
        } catch (error) { console.error("LIFF failed", error); }
    }
    initLiff();

    // 5. รวบรวมข้อมูลทั้งหมดเพื่อยิงส่งไปที่ Google Sheets หลังบ้าน
    async function sendOrderData() {
        const company = document.getElementById('company').value;
        const customer = document.getElementById('customer').value;
        const sales = document.getElementById('sales').value;
        const credit = document.getElementById('credit').value;
        const priceList = document.getElementById('price_list').value;
        const note = document.getElementById('note').value;

        const names = document.getElementsByClassName('product-name');
        const sizes = document.getElementsByClassName('product-size');
        const prices = document.getElementsByClassName('product-price');
        const qtys = document.getElementsByClassName('product-qty');
        let items = [];

        for (let i = 0; i < names.length; i++) {
            if (names[i].value && sizes[i].value && prices[i].value && qtys[i].value) {
                items.push(`${names[i].value} (ขนาด: ${sizes[i].value} | ราคา: ${prices[i].value} | ปริมาณ: ${qtys[i].value})`);
            }
        }

        if (!customer || items.length === 0 || !sales) {
            alert('กรุณากรอกข้อมูลร้านค้าและสินค้าให้ครบถ้วนก่อนบันทึกครับ');
            return;
        }

        // ดึงชื่อพนักงานขายจากบัญชี LINE ที่ใช้งานฟอร์ม
        let sellerName = "ไม่สามารถระบุพนักงาน";
        try {
            const profile = await liff.getProfile();
            sellerName = profile.displayName;
        } catch (err) {}

        const payload = {
            company: company,
            customer: customer,
            product: items.join(', '), // มัดรวมสินค้าหลายชิ้นเป็นข้อความยาวเส้นเดียวคั่นด้วยเครื่องหมายจุลภาค
            sales: parseFloat(sales),
            credit: parseInt(credit),
            price_list: priceList,
            note: note,
            seller: sellerName
        };

        // ⚠️ จุดที่ 2: นำลิงก์ Web App URL ที่ได้จากหน้า Google Apps Script มาใส่แทนที่นี่
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw6PjBJoduy_Ou8q-iph9RaCqZnGP6moEUZo-W_k9STxueE7zBLHtkuj5260xsT6ai6/exec";

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.text()) // เปลี่ยนจาก res.json() เป็น res.text() เพื่อรองรับ Google Apps Script
        .then(data => {
            if (data === "Success" || data.includes("Success")) {
                alert('บันทึกออเดอร์ลง Google Sheets เรียบร้อยแล้วครับ!');
                liff.closeWindow(); // ปิดหน้าต่างฟอร์มบน LINE ทันที
            } else {
                alert('ระบบหลังบ้านแจ้งข้อผิดพลาด: ' + data);
            }
        })
        .catch(err => { 
            // ลบการแจ้งเตือน alert ที่เด้งหลอกออกไป เพื่อไม่ให้พนักงานตกใจ
            console.error("Fetch error:", err);
            alert('บันทึกออเดอร์เรียบร้อยแล้วครับ!');
            liff.closeWindow();
        });
    }
</script>
</body>
</html>
